name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_beta:
        description: Publish v0.11.0 after tests and Windows build pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  portable-tests:
    name: Portable tests (Linux, simulated APIs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run portable tests
        run: python3 tools/run-tests.py

  windows-build:
    name: Windows x64 build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Compile app
        shell: msys2 {0}
        run: MSYS2_ARG_CONV_EXCL='*' cmd.exe /c build-windows.bat
      - name: Package app
        shell: pwsh
        run: python tools/package-release.py --binary LANDELTA.exe --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: LANDELTA-Windows-build
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-beta:
    name: Publish Windows beta v0.11.0
    needs: [portable-tests, windows-build]
    if: >-
      github.repository == 'Landsxd/landelta' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_beta) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[release v0.11.0]')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: landelta-release-v0.11.0
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: LANDELTA-Windows-build
          path: release-assets
      - name: Verify release assets
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.11.0 >/dev/null 2>&1; then
            echo 'Release v0.11.0 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v0.11.0 \
            release-assets/LANDELTA.exe \
            release-assets/LANDELTA-Windows-Beta.zip \
            release-assets/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'LANDELTA 0.11 — Windows Beta' \
            --notes-file docs/RELEASE-v0.11.0.md \
            --prerelease --latest=false
